name: Actualización Automática de Datos (Deezer API)

on:
  schedule:
    # Todos los lunes a las 13:00 UTC (8:00 AM en Colombia/Medellín)
    - cron: '0 13 * * 1'
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

# Permisos explícitos para que el bot pueda hacer push del seed actualizado
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          # El GITHUB_TOKEN por defecto expira al terminar el job; con
          # persist-credentials el push dentro del job usa la sesión viva
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # aiohttp: la colecta del robot es asíncrona (scripts/
          # coleccion_asincrona.py — asyncio.gather + semáforo + backoff)
          # ML + parquet: el export corporativo para Power BI corre los
          # modelos (RF + Cox) y escribe data/output/dashboard_data.parquet
          pip install pandas requests duckdb aiohttp scikit-learn joblib \
            lifelines pyarrow

      - name: Ejecutar script de actualización
        run: python scripts/daily_update.py

      # Fase 2 — ADN básico: regenera las features predictoras (X) del modelo
      # de supervivencia. OJO: daily_update reescribe el seed con SOLO las
      # columnas núcleo, así que este paso es obligatorio inmediatamente
      # después (y antes del snapshot, para que el histórico lleve el ADN).
      - name: 🧬 Extraer ADN Básico (features predictoras)
        run: python scripts/extraer_adn_basico.py

      # Fase 1 — histórico: copia el seed fresco a data/snapshots/ con fecha.
      # Es la materia prima del modelo de supervivencia (time-to-breakout).
      - name: 📊 Guardar snapshot histórico semanal
        run: python scripts/guardar_snapshot.py

      # ⏱️ Máquina del Tiempo: con SQL (LAG + ROW_NUMBER sobre los CSV de
      # data/snapshots/) calcula el crecimiento semana a semana por artista
      # y lo escribe en data/crecimiento_semanal.csv (lo consume el panel
      # "Máquina del Tiempo" del dashboard).
      - name: ⏱️ Calcular crecimiento semanal (window functions)
        run: python scripts/crecimiento_semanal.py

      # Enfoque híbrido: Python es el motor (ML + DuckDB) y Power BI la cara
      # corporativa. Este export congela el dataset enriquecido (mart scored
      # + RF viral + Cox + cohorte + crecimiento) en Parquet/CSV para que
      # Power BI Desktop lo consuma sin tocar Python.
      - name: 📦 Exportar dataset para Power BI (Parquet + CSV)
        run: python scripts/exportar_powerbi.py

      # Alertas proactivas: repasa el seed fresco y notifica por Telegram los
      # artistas en FIRMAR AHORA (misma fórmula que el mart de dbt). Los
      # credenciales viven SOLO como Secrets del repo (Settings → Secrets and
      # variables → Actions): nunca en el código.
      - name: Ejecutar sistema de alertas A&R
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # El snapshot anterior vive en git HEAD (daily_update ya reescribió
          # el seed): activa el delta de fans en el mensaje.
          TELEGRAM_INCLUIR_DELTA: '1'
        run: python scripts/send_ar_alerts.py

      - name: 📊 Commit de snapshots históricos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Snapshot histórico semanal - $(date +%Y-%m-%d)"
          git push

      - name: Guardar cambios en GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ar_dbt_project/seeds/deezer_artists_data.csv
          git diff --cached --quiet \
            && echo "Sin cambios de datos: no se crea commit" \
            || git commit -m "🤖 Auto-update: Nuevos datos de Deezer API ($(date -u +%Y-%m-%d))"
          git push
